<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Projeto semântico colorido</title>
        <style>
            header{
                background-color: cornflowerblue;
            }
            nav{
                background-color: darkorange;
            }
           main{
            background-color: lightgrey;
           }
           section{
            background-color: gold;
           }
           article{
            background-color: seagreen;
           }
           aside{
            background-color: mediumorchid;
           }
           footer{
            background-color: rgb(49, 51, 80);
           }
            h1{
                color: #FFFFFF;
            }
        </style>
        <link rel="stylesheet" href="../assets/css/style.css">
    </head>
    <body>
        <header>
            <h1>Título do Site (Header)</h1>
            <nav>
                <ul>
                    <li><a href="#">Início</a></li>
                    <li><a href="#">Sobre</a></li>
                </ul>
            </nav>
        </header>        
        <main>
            <section>
                <h2>Nossa Missão (Section)</h2>
                <article>
                    <h3>Hisória da Empresa (Article)</h3>
                    <p>Conteúdo independente...</p>
                </article>
            </section>
            <aside>
                <p style="color:#FFFFFF">Links Relacionados (Aside)</p>
            </aside>
        </main>
        <footer>
            <p style="color:#FFFFFF">© 2026 - Rodapé Semântico</p>
        </footer>
    </body>
</html>
