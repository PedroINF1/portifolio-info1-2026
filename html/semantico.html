<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Projeto semântico colorido</title>
        <style>
            header{
                background-color: cornflowerblue;
                padding: 10px;
                border: 10px solid skyblue;
                margin: 10px;
                background-clip: content-box;
            }
            nav{
                background-color: darkorange;
                padding: 5px;
                border: 5px solid blue;
                margin: 5px;
                background-clip: content-box;
            }
           main{
            background-color: lightgrey;
            padding: 10px;
            border: 10px solid grey;
            margin: 10px;
            background-clip: content-box;
           }
           section{
            background-color: gold;
            padding: 10px;
            border: 10px solid grey;
            margin: 10px;
            background-clip: content-box;
           }
           article{
            background-color: seagreen;
            padding: 5px;
            border: 2px dashed seagreen;
            margin: 5px;
            background-clip: content-box;
           }
           aside{
            background-color: mediumorchid;
            padding: 10px;
            border: 10px solid grey;
            margin: 10px;
            background-clip: content-box;
           }
           footer{
            background-color: rgb(49, 51, 80);
            padding: 5px;
            border: 5px solid lightgrey;
            margin: 5px;
            background-clip: content-box;
           }
            h1{
                color: #FFFFFF;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Título do Site (Header)</h1>
            <nav>
                <ul>
                    <li><a href="#">Início</a></li>
                    <li><a href="#">Sobre</a></li>
                </ul>
            </nav>
        </header>        
        <main>
            <section>
                <h2>Nossa Missão (Section)</h2>
                <article>
                    <h3>Hisória da Empresa (Article)</h3>
                    <p>Conteúdo independente...</p>
                </article>
            </section>
            <aside>
                <p style="color:#FFFFFF">Links Relacionados (Aside)</p>
            </aside>
        </main>
        <footer>
            <p style="color:#FFFFFF">© 2026 - Rodapé Semântico</p>
        </footer>
    </body>
</html>
